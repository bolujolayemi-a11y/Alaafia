<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4972A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4F10;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" />

  <!-- Soft inner glow ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Stem -->
  <path
    d="M50 78 L50 52"
    fill="none"
    stroke="url(#leafGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Main center leaf -->
  <path
    d="M50 52
       C50 52, 36 46, 34 32
       C34 32, 48 30, 54 40
       C58 46, 50 52, 50 52 Z"
    fill="url(#leafGrad)"
  />

  <!-- Right leaf -->
  <path
    d="M50 63
       C50 63, 60 55, 70 57
       C70 57, 66 68, 56 68
       C51 68, 50 63, 50 63 Z"
    fill="rgba(255,255,255,0.75)"
  />

  <!-- Left leaf -->
  <path
    d="M50 58
       C50 58, 40 50, 30 52
       C30 52, 33 63, 43 64
       C48 64, 50 58, 50 58 Z"
    fill="rgba(255,255,255,0.6)"
  />

  <!-- Center vein on main leaf -->
  <path
    d="M50 52 C50 52, 44 44, 40 35"
    fill="none"
    stroke="rgba(200,140,40,0.4)"
    stroke-width="1"
    stroke-linecap="round"
  />

  <!-- Three dots at top — sunrise -->
  <circle cx="50" cy="22" r="2.2" fill="rgba(255,255,255,0.9)"/>
  <circle cx="41" cy="25" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="59" cy="25" r="1.5" fill="rgba(255,255,255,0.6)"/>
</svg>
